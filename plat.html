<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pixel Hopper</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#080b16;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

#game{
    display:block;
    margin:auto;
    background:#111827;
    width:900px;
    height:600px;
    max-width:100vw;
    max-height:100vh;
}

#hud{
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    width:min(880px,95vw);
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:10;
    pointer-events:none;
}

.hudBox{
    background:rgba(0,0,0,.65);
    border:2px solid #475569;
    border-radius:10px;
    padding:8px 14px;
    font-weight:bold;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(3,7,18,.92);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:20;
}

.panel{
    width:min(600px,90vw);
    padding:35px;
    text-align:center;
    background:#111827;
    border:3px solid #38bdf8;
    border-radius:20px;
    box-shadow:0 0 40px rgba(56,189,248,.2);
}

h1{
    font-size:50px;
    margin-bottom:10px;
    color:#38bdf8;
}

h2{
    font-size:32px;
    margin-bottom:15px;
}

p{
    color:#cbd5e1;
    margin:10px 0;
    line-height:1.5;
}

.gameButton{
    margin-top:20px;
    padding:14px 35px;
    font-size:20px;
    font-weight:bold;
    border:0;
    border-radius:12px;
    background:#38bdf8;
    color:#06111b;
    cursor:pointer;
}

.gameButton:hover{
    transform:scale(1.05);
}

.hidden{
    display:none !important;
}

#touchControls{
    position:fixed;
    bottom:15px;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:0 20px;
    z-index:15;
    pointer-events:none;
}

.touchGroup{
    display:flex;
    gap:10px;
}

.touchButton{
    width:65px;
    height:65px;
    border-radius:50%;
    border:2px solid #64748b;
    background:rgba(15,23,42,.8);
    color:white;
    font-size:25px;
    pointer-events:auto;
    user-select:none;
}

@media(min-width:800px){
    #touchControls{
        display:none;
    }
}
</style>
</head>

<body>

<canvas id="game" width="900" height="600"></canvas>

<div id="hud">
    <div class="hudBox" id="levelText">Level 1</div>
    <div class="hudBox" id="nameText">Forest Trail</div>
    <div class="hudBox" id="coinText">Coins: 0</div>
</div>

<div id="startScreen" class="overlay">
    <div class="panel">
        <h1>PIXEL HOPPER</h1>
        <p>10 completely different levels.</p>
        <p>
            A / D or Arrow Keys = Move<br>
            W / Space / Up = Jump<br>
            F = Toggle Flight on Level 10<br>
            S / Down = Fly Down<br>
            P = Pause
        </p>
        <button class="gameButton" id="startButton">START GAME</button>
    </div>
</div>

<div id="levelScreen" class="overlay hidden">
    <div class="panel">
        <h2 id="levelTitle">Level Complete!</h2>
        <p id="levelMessage"></p>
        <button class="gameButton" id="nextButton">NEXT LEVEL</button>
    </div>
</div>

<div id="deathScreen" class="overlay hidden">
    <div class="panel">
        <h2>💀 OOPS!</h2>
        <p>You crashed!</p>
        <button class="gameButton" id="retryButton">RETRY LEVEL</button>
    </div>
</div>

<div id="winScreen" class="overlay hidden">

        <h1>🏆 YOU WIN!</h1>
        <p>You beat all 10 levels!</p>
        <p id="finalCoins"></p>
        <button class="gameButton" id="restartButton">PLAY AGAIN</button>
    </div>
</div>

<div id="touchControls">
    <div class="touchGroup">
        <button class="touchButton" id="leftBtn">◀</button>
        <button class="touchButton" id="rightBtn">▶</button>
    </div>

    <div class="touchGroup">
        <button class="touchButton" id="jumpBtn">▲</button>
    </div>
</div>

/* =========================================================
   INPUT
========================================================= */

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if(
        e.key === " " ||
        e.key === "ArrowUp" ||
        e.key.toLowerCase() === "w"
    ){
        e.preventDefault();

        if(!e.repeat){
            jump();
        }
    }

    if(e.key.toLowerCase() === "p"){
        paused = !paused;
    }

    if(e.key.toLowerCase() === "f"){
        if(currentLevel === 9){
            player.flying = !player.flying;
            player.vy = 0;
        }
    }
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});


/* =========================================================
   TOUCH
========================================================= */

function touchKey(button, key){
    button.addEventListener("pointerdown", e=>{
        e.preventDefault();
        keys[key] = true;
    });

    button.addEventListener("pointerup", e=>{
        e.preventDefault();
        keys[key] = false;
    });

    button.addEventListener("pointercancel", ()=>{
        keys[key] = false;
    });

    button.addEventListener("pointerleave", ()=>{
        keys[key] = false;
    });
}

touchKey(document.getElementById("leftBtn"),"a");
touchKey(document.getElementById("rightBtn"),"d");

document.getElementById("jumpBtn").addEventListener("pointerdown",e=>{

function rect(x,y,w,h){

        launchPad(1050,406,60,-16),
        launchPad(1350,286,60,-17),
        launchPad(1710,436,60,-16),
        launchPad(2060,336,60,-16),
        launchPad(2410,486,60,-17),
        launchPad(2900,636,60,-16),
        launchPad(3260,536,60,-16),
        launchPad(3570,386,60,-17),
        launchPad(3920,536,60,-16),
        launchPad(4320,386,60,-17)
    ],

    airObstacles:[
        airBlock(2550,0,60,250),
        airBlock(2550,500,60,1300),

        airBlock(3750,0,60,300),
        airBlock(3750,600,60,1200),

        airBlock(4650,0,60,250),
        airBlock(4650,500,60,1300)
    ],

    coins:[
        coin(300,450),
        coin(760,460),
        coin(1080,360),
        coin(1390,240),
        coin(1750,390),
        coin(2100,290),
        coin(2450,440),
        coin(2950,590),
        coin(3330,490),
        coin(3630,340),
        coin(4000,490),
        coin(4380,340),
        coin(4600,240),
        coin(5000,440)
    ],

    portal:{
        x:5100,
        y:420,
        w:55,
        h:90
    }
});


/* =========================================================
   CLONE LEVEL
========================================================= */

function cloneLevel(index){

    const source = levels[index];

    return {
        ...source,

        platforms:source.platforms.map(p=>({...p})),

        movingPlatforms:(source.movingPlatforms || [])
            .map(p=>({...p})),

        spikes:source.spikes.map(s=>({...s})),

        launchPads:source.launchPads.map(p=>({...p})),

        airObstacles:source.airObstacles.map(o=>({...o})),

        coins:source.coins.map(c=>({...c})),

        portal:{...source.portal}
    };
}


/* =========================================================
   LOAD LEVEL
========================================================= */

function loadLevel(index){

    currentLevel = index;

    level = cloneLevel(index);

    worldWidth = level.width;
    worldHeight = level.height;

    levelCoins = 0;

    player.x = 60;
    player.y = level.type === "fly" ? 450 : 450;

    player.vx = 0;
    player.vy = 0;

    player.grounded = false;
    player.jumpsLeft = 2;

    player.flying = level.type === "fly";

    if(level.type === "mixed"){
        player.flying = false;
    }

    cameraX = 0;
    cameraY = 0;

    levelText.textContent =
        "Level " + (index + 1);

    nameText.textContent =
        level.name;

    updateCoins();
}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    startScreen.classList.add("hidden");
    levelScreen.classList.add("hidden");
    deathScreen.classList.add("hidden");
    winScreen.classList.add("hidden");

    paused = false;
    gameRunning = true;

    totalCoins = 0;

    loadLevel(0);
}


/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(!gameRunning || paused) return;

    if(level && level.type === "fly"){
        return;
    }

    if(player.grounded){

        player.vy = player.jumpPower;
        player.grounded = false;
        player.jumpsLeft = 1;

        return;
    }

    if(player.jumpsLeft === 1){

        player.vy = player.jumpPower;
        player.jumpsLeft = 0;

        return;
    }
}


/* =========================================================
   COLLISION
========================================================= */

function intersects(a,b){

    return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
    );
}


/* =========================================================
   UPDATE MOVING PLATFORMS
========================================================= */

function updateMovingPlatforms(){

    if(!level.movingPlatforms) return;

    for(const p of level.movingPlatforms){

        p.t += p.speed;

        if(p.axis === "x"){
            p.x =
                p.startX +
                Math.sin(p.t) * p.range;
        }else{
            p.y =
                p.startY +
                Math.sin(p.t) * p.range;
        }
    }
}


/* =========================================================
   RUNNING PHYSICS
========================================================= */

function updateRunning(){

    let horizontal = 0;

    if(keys["a"] || keys["arrowleft"]){
        horizontal--;
    }

    if(keys["d"] || keys["arrowright"]){
        horizontal++;
    }

    if(horizontal !== 0){

        player.vx +=
            horizontal * player.acceleration;

        player.vx =
            clamp(
                player.vx,
                -player.maxSpeed,
                player.maxSpeed
            );

        player.facing = horizontal;
    }
    else{

        player.vx *= player.friction;

        if(Math.abs(player.vx) < .05){
            player.vx = 0;
        }
    }

    player.x += player.vx;

    player.vy += player.gravity;

    player.vy =
        Math.min(
            player.vy,
            player.maxFall
        );

    const oldY = player.y;

    player.y += player.vy;

    player.grounded = false;

    const allPlatforms = [
        ...level.platforms,
        ...(level.movingPlatforms || [])
    ];

    for(const p of allPlatforms){

        const falling =
            player.vy >= 0;

        const crossedTop =
            oldY + player.h <= p.y &&
            player.y + player.h >= p.y;

        const horizontalHit =
            player.x + player.w > p.x &&
            player.x < p.x + p.w;

        if(
            falling &&
            crossedTop &&
            horizontalHit
        ){

            player.y = p.y - player.h;

            player.vy = 0;

            player.grounded = true;

            player.jumpsLeft = 2;
        }
    }

    for(const pad of level.launchPads){

        const touching =
            player.x + player.w > pad.x &&
            player.x < pad.x + pad.w &&
            player.y + player.h >= pad.y &&
            player.y + player.h <= pad.y + pad.h + 8 &&
            player.vy >= 0;

        if(touching){

            player.y = pad.y - player.h;

            player.vy = pad.power;

            player.grounded = false;

            player.jumpsLeft = 2;
        }
    }
}


/* =========================================================
   FLYING PHYSICS
========================================================= */

function updateFlying(){

    let horizontal = 0;
    let vertical = 0;

    if(keys["a"] || keys["arrowleft"]){
        horizontal--;
    }

    if(keys["d"] || keys["arrowright"]){
        horizontal++;
    }

    if(keys["w"] || keys["arrowup"]){
        vertical--;
    }

    if(keys["s"] || keys["arrowdown"]){
        vertical++;
    }

    player.vx += horizontal * .24;
    player.vx =
        clamp(
            player.vx,
            -player.flySpeed,
            player.flySpeed
        );

    if(horizontal === 0){
        player.vx *= .94;
    }

    player.vy += vertical * .24;

    player.vy =
        clamp(
            player.vy,
            -player.flySpeed,
            player.flySpeed
        );

    if(vertical === 0){
        player.vy *= .90;
    }

    player.x += player.vx;
    player.y += player.vy;
}


/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayer(){

    if(level.type === "fly"){

        updateFlying();

    }else if(level.type === "mixed" && player.flying){

        updateFlying();

    }else{

        updateRunning();
    }

    player.x =
        clamp(
            player.x,
            0,
            worldWidth - player.w
        );

    if(player.y < 0){
        player.y = 0;
        player.vy = 0;
    }

    if(player.y > worldHeight + 300){

        die();

        return;
    }
}


/* =========================================================
   SPIKE COLLISION
========================================================= */

function checkSpikes(){

    if(player.invincible > 0){
        player.invincible--;
        return;
    }

    for(const s of level.spikes){

        const hitbox = {
            x:s.x + 5,
            y:s.y + 5,
            w:s.w - 10,
            h:s.h - 5
        };

        if(intersects(player,hitbox)){

            die();

            return;
        }
    }
}


/* =========================================================
   AIR OBSTACLE COLLISION
========================================================= */

function checkAirObstacles(){

    for(const o of level.airObstacles){

        if(intersects(player,o)){

            die();

            return;
        }
    }
}


/* =========================================================
   COINS
========================================================= */

function collectCoins(){

    for(const c of level.coins){

        if(c.collected) continue;

        const dx =
            player.x + player.w/2 - c.x;

        const dy =
            player.y + player.h/2 - c.y;

        const distance =
            Math.sqrt(dx*dx + dy*dy);

        if(distance < 25){

            c.collected = true;

            levelCoins++;

            totalCoins++;

            updateCoins();
        }
    }
}

function updateCoins(){

    coinText.textContent =
        "Coins: " + totalCoins;
}


/* =========================================================
   PORTAL
========================================================= */

function checkPortal(){

    if(intersects(player,level.portal)){

        completeLevel();
    }
}


/* =========================================================
   DEATH
========================================================= */

function die(){

    if(!gameRunning) return;

    gameRunning = false;

    deathScreen.classList.remove("hidden");
}


/* =========================================================
   COMPLETE LEVEL
========================================================= */

function completeLevel(){

    if(!gameRunning) return;

    gameRunning = false;

    if(currentLevel === levels.length - 1){

        finalCoins.textContent =
            "Coins collected: " +
            totalCoins;

        winScreen.classList.remove("hidden");

        return;
    }

    levelTitle.textContent =
        "Level " +
        (currentLevel + 1) +
        " Complete! 🎉";

    levelMessage.textContent =
        "You collected " +
        levelCoins +
        " coins. Ready for the next challenge?";

    levelScreen.classList.remove("hidden");
}


/* =========================================================
   NEXT LEVEL
========================================================= */

function nextLevel(){

    levelScreen.classList.add("hidden");

    gameRunning = true;

    loadLevel(currentLevel + 1);
}


/* =========================================================
   RETRY
========================================================= */

function retryLevel(){

    deathScreen.classList.add("hidden");

    gameRunning = true;

    loadLevel(currentLevel);
}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    winScreen.classList.add("hidden");

    totalCoins = 0;

    gameRunning = true;

    loadLevel(0);
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    const targetX =
        player.x - WIDTH * .40;

    cameraX =
        lerp(
            cameraX,
            clamp(
                targetX,
                0,
                Math.max(
                    0,
                    worldWidth - WIDTH
                )
            ),
            .10
        );

    const targetY =
        player.y - HEIGHT * .45;

    cameraY =
        lerp(
            cameraY,
            clamp(
                targetY,
                0,
                Math.max(
                    0,
                    worldHeight - HEIGHT
                )
            ),
            .10
        );
}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){

    ctx.fillStyle = level.bg;

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    const colors = [
        "rgba(255,255,255,.05)",
        "rgba(255,255,255,.08)",
        "rgba(255,255,255,.04)"
    ];

    for(let i=0;i<30;i++){

        const x =
            ((i*317) - cameraX*.2) % WIDTH;

        const y =
            ((i*173) - cameraY*.15) % HEIGHT;

        ctx.fillStyle =
            colors[i % colors.length];

        ctx.fillRect(
            x,
            y,
            80,
            20
        );
    }
}


/* =========================================================
   DRAW PLATFORM
========================================================= */

function drawPlatform(p){

    ctx.fillStyle = "#334155";

    ctx.fillRect(
        p.x,
        p.y,
        p.w,
        p.h
    );

    ctx.fillStyle = "#64748b";

    ctx.fillRect(
        p.x,
        p.y,
        p.w,
        7
    );
}


/* =========================================================
   DRAW MOVING PLATFORM
========================================================= */

function drawMovingPlatform(p){

    ctx.fillStyle = "#a855f7";

    ctx.fillRect(
        p.x,
        p.y,
        p.w,
        p.h
    );

    ctx.fillStyle = "#e9d5ff";

    ctx.fillRect(
        p.x,
        p.y,
        p.w,
        5
    );
}


/* =========================================================
   DRAW SPIKE
========================================================= */

function drawSpike(s){

    ctx.fillStyle = "#ef4444";

    ctx.beginPath();

    ctx.moveTo(
        s.x,
        s.y + s.h
    );

    ctx.lineTo(
        s.x + s.w/2,
        s.y
    );

    ctx.lineTo(
        s.x + s.w,
        s.y + s.h
    );

    ctx.closePath();

    ctx.fill();
}


/* =========================================================
   DRAW LAUNCH PAD
========================================================= */

function drawLaunchPad(p){

    ctx.fillStyle = "#f59e0b";

    ctx.fillRect(
        p.x,
        p.y,
        p.w,
        p.h
    );

    ctx.fillStyle = "#fde047";

    ctx.beginPath();

    ctx.moveTo(
        p.x + p.w/2,
        p.y - 16
    );

    ctx.lineTo(
        p.x + 8,
        p.y
    );

    ctx.lineTo(
        p.x + p.w - 8,
        p.y
    );

    ctx.closePath();

    ctx.fill();
}


/* =========================================================
   DRAW AIR OBSTACLE
========================================================= */

function drawAirObstacle(o){

    ctx.fillStyle = "#dc2626";

    ctx.fillRect(
        o.x,
        o.y,
        o.w,
        o.h
    );

    ctx.fillStyle = "#fca5a5";

    ctx.fillRect(
        o.x + 8,
        o.y,
        5,
        o.h
    );
}


/* =========================================================
   DRAW COIN
========================================================= */

function drawCoin(c){

    if(c.collected) return;

    ctx.fillStyle = "#facc15";

    ctx.beginPath();

    ctx.arc(
        c.x,
        c.y,
        c.r,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle = "#fff7ae";

    ctx.beginPath();

    ctx.arc(
        c.x - 3,
        c.y - 3,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================================================
   DRAW PORTAL
========================================================= */

function drawPortal(){

    const p = level.portal;

    const pulse =
        Math.sin(Date.now()*.006)*5;

    ctx.fillStyle = "#22d3ee";

    ctx.fillRect(
        p.x - pulse/2,
        p.y - pulse/2,
        p.w + pulse,
        p.h + pulse
    );

    ctx.fillStyle = "#172554";

    ctx.fillRect(
        p.x + 8,
        p.y + 8,
        p.w - 16,
        p.h - 16
    );
}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(){

    if(
        player.invincible > 0 &&
        Math.floor(player.invincible/5)%2 === 0
    ){
        return;
    }

    ctx.save();

    ctx.translate(
        player.x + player.w/2,
        player.y + player.h/2
    );

    ctx.scale(
        player.facing,
        1
    );

    /* body */
    ctx.fillStyle = "#38bdf8";

    ctx.fillRect(
        -14,
        -18,
        28,
        36
    );

    /* hair */
    ctx.fillStyle = "#1e293b";

    ctx.fillRect(
        -13,
        -18,
        26,
        8
    );

    /* face */
    ctx.fillStyle = "#fcd34d";

    ctx.fillRect(
        -10,
        -8,
        20,
        13
    );

    /* eye */
    ctx.fillStyle = "#020617";

    ctx.fillRect(
        4,
        -5,
        3,
        3
    );

    /* shirt */
    ctx.fillStyle = "#2563eb";

    ctx.fillRect(
        -10,
        5,
        20,
        10
    );

    /* legs */
    ctx.fillStyle = "#1e293b";

    ctx.fillRect(
        -10,
        15,
        7,
        7
    );

    ctx.fillRect(
        3,
        15,
        7,
        7
    );

    /* flying effect */
    if(player.flying){

        ctx.fillStyle = "#67e8f9";

        ctx.beginPath();

        ctx.moveTo(-14,8);
        ctx.lineTo(-27,18);
        ctx.lineTo(-14,18);

        ctx.closePath();

        ctx.fill();

        ctx.beginPath();

        ctx.moveTo(14,8);
        ctx.lineTo(27,18);
        ctx.lineTo(14,18);

        ctx.closePath();

        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   DRAW LEVEL
========================================================= */

function drawLevel(){

    drawBackground();

    ctx.save();

    ctx.translate(
        -cameraX,
        -cameraY
    );

    for(const p of level.platforms){
        drawPlatform(p);
    }

    for(const p of (level.movingPlatforms || [])){
        drawMovingPlatform(p);
    }

    for(const s of level.spikes){
        drawSpike(s);
    }

    for(const p of level.launchPads){
        drawLaunchPad(p);
    }

    for(const o of level.airObstacles){
        drawAirObstacle(o);
    }

    for(const c of level.coins){
        drawCoin(c);
    }

    drawPortal();

    drawPlayer();

    ctx.restore();
}


/* =========================================================
   MAIN UPDATE
========================================================= */

function update(){

    if(!gameRunning || paused){
        return;
    }

    updateMovingPlatforms();

    updatePlayer();

    checkSpikes();

    if(level.type === "fly" ||
       (level.type === "mixed" && player.flying)){

        checkAirObstacles();
    }

    collectCoins();

    checkPortal();

    updateCamera();
}


/* =========================================================
   PAUSE DISPLAY
========================================================= */

function drawPause(){

    if(!paused) return;

    ctx.fillStyle =
        "rgba(0,0,0,.55)";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    ctx.fillStyle = "white";

    ctx.font =
        "bold 50px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
        "PAUSED",
        WIDTH/2,
        HEIGHT/2
    );

    ctx.font =
        "20px Arial";

    ctx.fillText(
        "Press P to continue",
        WIDTH/2,
        HEIGHT/2 + 45
    );

    ctx.textAlign = "left";
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(){

    update();

    if(level){

        drawLevel();

        drawPause();
    }
    else{

        ctx.fillStyle = "#111827";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );
    }

    requestAnimationFrame(gameLoop);
}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById("startButton")
.addEventListener("click",startGame);

document.getElementById("nextButton")
.addEventListener("click",nextLevel);

document.getElementById("retryButton")
.addEventListener("click",retryLevel);

document.getElementById("restartButton")
.addEventListener("click",restartGame);


/* =========================================================
   INITIALIZE
========================================================= */

loadLevel(0);

gameRunning = false;

gameLoop();

</script>
