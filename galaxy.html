<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Metamorphic Particle Animation</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{width:100vw;height:100vh;display:block;cursor:crosshair}#ui{position:fixed;top:16px;left:16px;color:#fff;background:#0008;border:1px solid #fff2;border-radius:14px;padding:12px;font:13px Arial;backdrop-filter:blur(8px)}#ui b{display:block;margin-bottom:8px;letter-spacing:1px}button{color:#fff;background:#ffffff12;border:1px solid #fff3;border-radius:8px;padding:7px 9px;margin:2px;cursor:pointer}button:hover{background:#fff2}#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#fffb;font:12px Arial;pointer-events:none}</style></head>
<body><canvas id="c"></canvas><div id="ui"><b>METAMORPHIC PARTICLES</b><button onclick="morph('sphere')">Sphere</button><button onclick="morph('torus')">Torus</button><button onclick="morph('heart')">Heart</button><button onclick="morph('star')">Star</button><button onclick="morph('vortex')">Vortex</button><button onclick="explode()">EXPLODE</button></div><div id="hint">Move mouse • Click to disturb • SPACE to morph</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D;function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
const mouse={x:W/2,y:H/2,down:false};addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('pointerdown',()=>{mouse.down=true;explode()});addEventListener('pointerup',()=>mouse.down=false);
const N=6000,names=['sphere','torus','heart','star','vortex'];let shape=0,last=performance.now(),auto=0;const P=[];const rnd=(a,b)=>a+Math.random()*(b-a);
function sph(){let u=Math.random()*2-1,a=Math.random()*Math.PI*2,s=Math.sqrt(1-u*u),r=Math.pow(Math.random(),.43);return{x:s*Math.cos(a)*r,y:s*Math.sin(a)*r,z:u*r}}
function target(t,i){let q=i/N,a=q*Math.PI*2; if(t==='sphere')return sph();let X=0,Y=0,Z=0;if(t==='torus'){let b=(i*.6180339887%1)*Math.PI*2,R=.64,r=.28;X=(R+r*Math.cos(b))*Math.cos(a);Y=(R+r*Math.cos(b))*Math.sin(a);Z=r*Math.sin(b)}else if(t==='heart'){let s=Math.sqrt(Math.random());X=16*Math.sin(a)**3/18*s;Y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))/18*s;Z=rnd(-.22,.22)*s}else if(t==='star'){let r=(Math.floor(q*10)%2===0?.98:.4)*Math.sqrt(Math.random());X=Math.cos(a)*r;Y=Math.sin(a)*r;Z=rnd(-.3,.3)}else{let r=Math.pow(Math.random(),.65),b=q*Math.PI*22+r*5;X=Math.cos(b)*r;Y=Math.sin(b)*r;Z=(q-.5)*1.7+Math.sin(b*2)*.12}return{x:X,y:Y,z:Z}}
for(let i=0;i<N;i++){let p=sph(),t=target('sphere',i);P.push({x:p.x,y:p.y,z:p.z,tx:t.x,ty:t.y,tz:t.z,vx:0,vy:0,vz:0,s:rnd(.4,1.7),ph:rnd(0,6.28),h:rnd(185,290)})}
function morph(t){shape=names.indexOf(t);for(let i=0;i<N;i++){let q=target(t,i),p=P[i];p.tx=q.x;p.ty=q.y;p.tz=q.z}}function explode(){for(let p of P){let d=Math.hypot(p.x,p.y,p.z)||1,k=rnd(2.5,7);p.vx+=p.x/d*k;p.vy+=p.y/d*k;p.vz+=p.z/d*k}}addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();morph(names[(shape+1)%names.length])}if(e.key.toLowerCase()==='e')explode()});
function rot(a,b,z,A,B){let cy=Math.cos(B),sy=Math.sin(B),X=a*cy-z*sy,Z=a*sy+z*cy,cx=Math.cos(A),sx=Math.sin(A),Y=b*cx-Z*sx;Z=b*sx+Z*cx;return{x:X,y:Y,z:Z}}
function loop(now){let dt=Math.min((now-last)/1000,.033);last=now;auto+=dt;if(auto>7){auto=0;morph(names[(shape+1)%names.length])}x.fillStyle='rgba(0,0,0,.18)';x.fillRect(0,0,W,H);let cx=W/2,cy=H/2,S=Math.min(W,H)*.37,A=now*.00011,B=now*.00025,mx=(mouse.x-cx)/S,my=(mouse.y-cy)/S,arr=[];for(let p of P){p.vx+=(p.tx-p.x)*19*dt;p.vy+=(p.ty-p.y)*19*dt;p.vz+=(p.tz-p.z)*19*dt;p.vx+=Math.sin(now*.001+p.ph)*.08*dt;p.vy+=Math.cos(now*.0012+p.ph)*.08*dt;let dx=mx-p.x,dy=my-p.y,d=Math.hypot(dx,dy);if(d<.62){let f=(mouse.down?7:-2.3)*(1-d/.62);p.vx+=dx*f*dt;p.vy+=dy*f*dt}p.vx*=Math.pow(.045,dt);p.vy*=Math.pow(.045,dt);p.vz*=Math.pow(.045,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;let r=rot(p.x,p.y,p.z,A,B),pers=1.8/(2.8-r.z);arr.push({p:p,X:cx+r.x*S*pers,Y:cy+r.y*S*pers,Z:r.z,s:p.s*pers})}arr.sort((a,b)=>a.Z-b.Z);x.globalCompositeOperation='lighter';for(let q of arr){let p=q.p,al=.1+.82*(q.Z+1)/2,pulse=.72+.28*Math.sin(now*.002+p.ph),hu=(p.h+now*.025+q.Z*35)%360;x.fillStyle=`hsla(${hu},100%,${62+20*pulse}%,${al})`;x.shadowBlur=8;x.shadowColor=`hsla(${hu},100%,65%,${al})`;x.beginPath();x.arc(q.X,q.Y,Math.max(.4,q.s*pulse),0,Math.PI*2);x.fill()}x.shadowBlur=0;x.globalCompositeOperation='source-over';requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
